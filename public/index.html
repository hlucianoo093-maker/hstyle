<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Opening your studio's appointment website." />
    <meta http-equiv="refresh" content="1;url=/" />
    <title>Studio bookings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 2rem; background: #18231e; color: #f5f3ed; font-family: 'DM Sans', sans-serif; }
      main { width: min(680px, 100%); }
      p { color: #c1c9bd; }
      .eyebrow { color: #d3ef75; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { max-width: 600px; margin: 0.8rem 0 1.4rem; font: 600 4.5rem/0.98 'Cormorant Garamond', serif; }
      a { display: inline-flex; min-height: 46px; align-items: center; margin-top: 1.25rem; padding: 0 1rem; border-radius: 4px; background: #d3ef75; color: #172019; font-weight: 700; text-decoration: none; }
      @media (max-width: 600px) { h1 { font-size: 3.2rem; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Studio bookings</p>
      <h1>Your next visit starts here.</h1>
      <p>Opening the studio website now.</p>
      <a href="/">Enter the studio</a>
    </main>
  </body>
</html>
